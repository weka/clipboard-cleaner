[package]
name = "clipboard-cleaner"
version = "0.1.0"
edition = "2021"
description = "Cross-platform clipboard cleaner that removes trailing suffixes and whitespace"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"

[dependencies]
clipboard-rs = "0.3"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
ctrlc = "3.4"
anyhow = "1.0"
